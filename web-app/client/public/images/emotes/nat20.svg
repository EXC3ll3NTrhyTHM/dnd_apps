<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Nat 20! - golden d20 with sparkles and glow -->
  <defs>
    <radialGradient id="n20glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Pulsing glow -->
  <circle cx="60" cy="58" r="50" fill="url(#n20glow)">
    <animate attributeName="r" values="40;55;40" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- D20 shape (icosahedron face) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5,60,58;5,60,58;-5,60,58" dur="2s" repeatCount="indefinite"/>
    <polygon points="60,18 92,38 84,78 36,78 28,38" fill="#b8860b" stroke="#daa520" stroke-width="2"/>
    <!-- Inner triangle facets -->
    <polygon points="60,18 92,38 60,52" fill="#d4a017" stroke="#daa520" stroke-width="1" opacity="0.7"/>
    <polygon points="60,18 28,38 60,52" fill="#c4960f" stroke="#daa520" stroke-width="1" opacity="0.5"/>
    <polygon points="28,38 36,78 60,52" fill="#a07810" stroke="#daa520" stroke-width="1" opacity="0.4"/>
    <polygon points="92,38 84,78 60,52" fill="#c49a12" stroke="#daa520" stroke-width="1" opacity="0.6"/>
    <polygon points="36,78 84,78 60,52" fill="#b8900e" stroke="#daa520" stroke-width="1" opacity="0.5"/>
    <!-- "20" text -->
    <text x="60" y="62" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" font-family="sans-serif" stroke="#b8860b" stroke-width="1">20</text>
  </g>
  <!-- Sparkles -->
  <circle cx="20" cy="25" r="3" fill="#ffd700">
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1;3;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="30" r="2.5" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="r" values="1;2.5;1" dur="1.1s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="95" cy="85" r="2" fill="#ffd700">
    <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="18" cy="80" r="2.5" fill="#fff">
    <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <!-- Star burst -->
  <g transform="translate(60,58)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
    <line x1="0" y1="-48" x2="0" y2="-42" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="42" x2="0" y2="48" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <line x1="-46" y1="0" x2="-40" y2="0" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="0" x2="46" y2="0" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
