<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Slow Clap - two hands coming together -->
  <!-- Left hand -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-12,0;0,0;-12,0" dur="0.8s" repeatCount="indefinite" keyTimes="0;0.35;1" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" calcMode="spline"/>
    <rect x="18" y="40" width="30" height="38" rx="10" fill="#e8a640"/>
    <rect x="20" y="28" width="8" height="18" rx="4" fill="#e8a640" transform="rotate(10,24,37)"/>
    <rect x="30" y="25" width="7" height="20" rx="3.5" fill="#e8a640" transform="rotate(3,33,35)"/>
    <rect x="38" y="27" width="7" height="18" rx="3.5" fill="#e8a640" transform="rotate(-3,41,36)"/>
    <rect x="45" y="32" width="7" height="15" rx="3.5" fill="#e8a640" transform="rotate(-8,48,39)"/>
  </g>
  <!-- Right hand -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="12,0;0,0;12,0" dur="0.8s" repeatCount="indefinite" keyTimes="0;0.35;1" keySplines="0.3 0 0.7 1;0.3 0 0.7 1" calcMode="spline"/>
    <rect x="62" y="40" width="30" height="38" rx="10" fill="#f0b64d" transform="scale(-1,1) translate(-172,0)"/>
    <rect x="72" y="28" width="8" height="18" rx="4" fill="#f0b64d" transform="rotate(-10,76,37)"/>
    <rect x="64" y="25" width="7" height="20" rx="3.5" fill="#f0b64d" transform="rotate(-3,67,35)"/>
    <rect x="56" y="27" width="7" height="18" rx="3.5" fill="#f0b64d" transform="rotate(3,59,36)"/>
    <rect x="49" y="32" width="7" height="15" rx="3.5" fill="#f0b64d" transform="rotate(8,52,39)"/>
  </g>
  <!-- Impact lines when hands meet -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" dur="0.8s" repeatCount="indefinite" keyTimes="0;0.3;0.38;0.55;1"/>
    <line x1="42" y1="30" x2="42" y2="18" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="55" y1="25" x2="60" y2="14" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="30" x2="72" y2="20" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="28" x2="28" y2="18" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
