<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Thumbs Up - bouncy golden hand -->
  <g transform="translate(60,65)">
    <animateTransform attributeName="transform" type="translate" values="60,65;60,55;60,65" dur="1s" repeatCount="indefinite" keyTimes="0;0.4;1" keySplines="0.2 0.8 0.2 1;0.2 0.8 0.2 1" calcMode="spline"/>
    <!-- Wrist -->
    <rect x="-8" y="5" width="16" height="25" rx="6" fill="#e8a640"/>
    <!-- Palm -->
    <rect x="-18" y="-20" width="36" height="30" rx="10" fill="#f0b64d"/>
    <!-- Thumb -->
    <rect x="-6" y="-48" width="14" height="35" rx="7" fill="#f0b64d" transform="rotate(-8)"/>
    <!-- Sparkles -->
    <g opacity="0.9">
      <circle cx="-30" cy="-35" r="3" fill="#fff">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="1;3;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="28" cy="-40" r="2.5" fill="#ffd700">
        <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="r" values="1;2.5;1" dur="0.9s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="20" cy="-55" r="2" fill="#fff">
        <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
    </g>
  </g>
</svg>
