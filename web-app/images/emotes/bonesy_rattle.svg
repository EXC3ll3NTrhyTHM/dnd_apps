<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Bonesy Rattles - skeleton skull shaking with rattling bones -->
  <g>
    <!-- Shaking animation -->
    <animateTransform attributeName="transform" type="rotate" values="-8,60,55;8,60,55;-8,60,55;6,60,55;-6,60,55;0,60,55" dur="0.5s" repeatCount="indefinite"/>
    <!-- Skull -->
    <ellipse cx="60" cy="48" rx="30" ry="28" fill="#e8e4d9"/>
    <!-- Skull shading -->
    <ellipse cx="60" cy="48" rx="30" ry="28" fill="url(#skullGrad)"/>
    <defs>
      <radialGradient id="skullGrad" cx="50%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#f5f0e8"/>
        <stop offset="100%" stop-color="#c4b99a"/>
      </radialGradient>
    </defs>
    <!-- Eye sockets -->
    <ellipse cx="48" cy="45" rx="9" ry="10" fill="#2d2416"/>
    <ellipse cx="72" cy="45" rx="9" ry="10" fill="#2d2416"/>
    <!-- Glowing pupils -->
    <circle cx="48" cy="46" r="3.5" fill="#ef4444">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="46" r="3.5" fill="#ef4444">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <!-- Nose hole -->
    <path d="M57,56 L60,60 L63,56" fill="#4a3f2f"/>
    <!-- Jaw/teeth -->
    <rect x="42" y="64" width="36" height="14" rx="4" fill="#d9d0c0"/>
    <!-- Tooth lines -->
    <line x1="48" y1="64" x2="48" y2="78" stroke="#a09880" stroke-width="1.5"/>
    <line x1="54" y1="64" x2="54" y2="78" stroke="#a09880" stroke-width="1.5"/>
    <line x1="60" y1="64" x2="60" y2="78" stroke="#a09880" stroke-width="1.5"/>
    <line x1="66" y1="64" x2="66" y2="78" stroke="#a09880" stroke-width="1.5"/>
    <line x1="72" y1="64" x2="72" y2="78" stroke="#a09880" stroke-width="1.5"/>
    <!-- Crack on skull -->
    <path d="M52,25 L55,35 L50,40" stroke="#8a7e68" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Floating bone fragments -->
  <g opacity="0.7">
    <rect x="18" y="70" width="12" height="4" rx="2" fill="#d9d0c0" transform="rotate(-20,24,72)">
      <animate attributeName="y" values="70;60;70" dur="0.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="-20,24,72;20,24,62;-20,24,72" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="88" y="68" width="10" height="3.5" rx="1.75" fill="#d9d0c0" transform="rotate(15,93,70)">
      <animate attributeName="y" values="68;58;68" dur="0.5s" repeatCount="indefinite" begin="0.15s"/>
      <animateTransform attributeName="transform" type="rotate" values="15,93,70;-25,93,58;15,93,70" dur="0.5s" repeatCount="indefinite" begin="0.15s"/>
    </rect>
    <circle cx="30" cy="90" r="3" fill="#d9d0c0">
      <animate attributeName="cy" values="90;82;90" dur="0.5s" repeatCount="indefinite" begin="0.25s"/>
    </circle>
  </g>
  <!-- Motion lines -->
  <g opacity="0.4">
    <line x1="14" y1="40" x2="20" y2="40" stroke="#8a7e68" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.5;0" dur="0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="38" x2="106" y2="38" stroke="#8a7e68" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.5;0" dur="0.25s" repeatCount="indefinite" begin="0.12s"/>
    </line>
  </g>
</svg>
