<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Rage - angry red face shaking -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,0;3,0;-2,0;2,0;0,0" dur="0.4s" repeatCount="indefinite"/>
    <!-- Face circle with angry gradient -->
    <circle cx="60" cy="58" r="40" fill="#dc2626"/>
    <circle cx="60" cy="58" r="40" fill="url(#rageGrad)"/>
    <defs>
      <radialGradient id="rageGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#ef4444"/>
        <stop offset="100%" stop-color="#991b1b"/>
      </radialGradient>
    </defs>
    <!-- Angry eyebrows -->
    <line x1="38" y1="42" x2="52" y2="48" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round"/>
    <line x1="82" y1="42" x2="68" y2="48" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round"/>
    <!-- Eyes - small angry dots -->
    <circle cx="46" cy="54" r="4" fill="#7f1d1d"/>
    <circle cx="74" cy="54" r="4" fill="#7f1d1d"/>
    <!-- Angry mouth -->
    <path d="M42,74 Q52,66 60,66 Q68,66 78,74" stroke="#7f1d1d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Steam/rage marks -->
    <g>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.6s" repeatCount="indefinite"/>
      <text x="24" y="28" font-size="18" fill="#ff6b6b" font-weight="bold" font-family="sans-serif">&#x1F4A2;</text>
      <text x="80" y="24" font-size="14" fill="#ff6b6b" font-weight="bold" font-family="sans-serif">&#x1F4A2;</text>
    </g>
    <!-- Pulsing vein -->
    <path d="M78,22 L82,16 L86,22 L90,16" stroke="#ff4444" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
